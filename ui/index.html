<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日志查看器</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="hero">
  <div class="hero-icon">📋</div>
  <div class="hero-text"><h1>日志查看器</h1><p id="heroSub">选择左侧文件开始查看</p></div>
  <div class="hero-status" id="status"><span class="dot"></span><span id="statusText">实时通道未连接</span></div>
  <button id="themeBtn" class="theme-btn" title="选择主题">🎨</button>
  <button id="cmdBtn" class="theme-btn" title="命令面板 (Ctrl+K)">⌘</button>
  <div id="themePanel" class="theme-panel" hidden>
    <div class="theme-opt" data-t="dbx"><span class="dot" style="background:#fafafa"></span>🖥️ DBX 原生</div>
    <div class="theme-opt" data-t="auto"><span class="dot" style="background:linear-gradient(135deg,#6d5dfc,#2cc9a7)"></span>🔄 跟随</div>
    <div class="theme-opt" data-t="light"><span class="dot" style="background:#f4f4fb"></span>☀️ 纸白</div>
    <div class="theme-opt" data-t="dark"><span class="dot" style="background:#13131a"></span>🌙 午夜</div>
    <div class="theme-opt" data-t="forest"><span class="dot" style="background:#0d1512"></span>🌲 墨绿</div>
    <div class="theme-opt" data-t="ocean"><span class="dot" style="background:#0f1a2e"></span>🌊 深海</div>
    <div class="theme-opt" data-t="sunset"><span class="dot" style="background:#1c1410"></span>🌇 黄昏</div>
    <div class="theme-opt" data-t="mint"><span class="dot" style="background:#eef7f3"></span>🌿 薄荷</div>
    <div class="theme-sep"></div>
    <div class="theme-sec">特效</div>
    <div class="theme-opt fx-opt" data-fx="flow"><span class="check">✓</span>✨ 实时流光</div>
    <div class="theme-opt fx-opt" data-fx="dist"><span class="check">✓</span>📊 级别分布</div>
    <div class="theme-opt fx-opt" data-fx="skel"><span class="check">✓</span>⏳ 骨架屏</div>
    <div class="theme-opt fx-opt" data-fx="keys"><span class="check">✓</span>⌨️ 快捷键提示</div>
    <div class="theme-opt fx-opt" data-fx="struct"><span class="check">✓</span>🎨 结构着色</div>
  </div>
</header>
<div class="card collapsed" id="fileCard"><h2 class="collhead" id="fileHead">📁 选择日志文件<span class="collsum" id="fileSum"></span></h2>
<div class="collbody" id="fileBody"><div id="crumb"></div>
<div class="toolbar"><input id="fileFilter" placeholder="过滤文件名，如 app" /><select id="fileSort"><option value="time">按修改时间</option><option value="name">按名称</option><option value="size">按大小</option></select><button id="refresh" class="ghost">↻ 刷新</button></div>
<div id="dirs"></div>
<div id="files"><span class="hint">连接后自动列出…</span></div>
<div id="hiddenbar"></div></div></div>
<div class="card collapsed" id="searchCard"><h2 class="collhead" id="searchHead">🔍 搜索条件<span class="collsum" id="searchSum"></span></h2>
<div class="collbody" id="searchBody">
  <div class="grid">
    <div><label>关键字 <label style="display:inline;font-weight:400"><input id="regexCk" type="checkbox" style="width:auto" /> 正则</label></label><input id="keyword" placeholder="输入搜索关键字，勾正则用表达式" /></div>
    <div><label>日志级别</label><select id="level">
      <option value="ALL">全部</option><option>ERROR</option><option>WARN</option>
      <option>INFO</option><option>DEBUG</option><option>TRACE</option></select></div>
    <div><label>每页行数</label><select id="pageSize">
      <option>50</option><option selected>100</option><option>200</option><option>500</option></select></div>
  </div>
  <div class="grid">
    <div><label>开始时间</label><input id="start" type="datetime-local" /></div>
    <div><label>结束时间（留空=至今）</label><input id="end" type="datetime-local" /></div>
    <div><label>排序方式</label><select id="sort">
      <option value="desc">最新在前</option><option value="asc">最早在前</option></select></div>
  </div>
  <div class="grid">
    <div><label>上下文行数</label><select id="context">
      <option value="0">仅命中行</option><option value="2">前后 2 行</option>
      <option value="5">前后 5 行</option><option value="10">前后 10 行</option></select></div>
    <div style="grid-column: span 2"><label>&nbsp;</label><div class="hint" style="margin-top:0">正则支持 . * + ? | ( ) [ ] ^ $ \d \w \s {m,n}；非法表达式后端会报错提示</div></div>
  </div>
  <div class="row" id="quickrow">
    <button class="ghost sm" data-min="10">近10分钟</button>
    <button class="ghost sm" data-min="60">近1小时</button>
    <button class="ghost sm" data-min="4320">近3天</button>
    <button class="ghost sm" data-min="10080">近1周</button>
    <button class="ghost sm" id="clearTime">清空时间</button>
  </div>
  <div class="row">
    <button id="search">🔍 搜索日志</button>
    <button id="download" class="green">⬇ 下载日志</button>
    <button id="tail" class="orange">⏱ 实时监控</button>
    <label style="display:inline"><input id="autoscroll" type="checkbox" checked style="width:auto" /> 自动滚动</label>
  </div>
  <div class="hint" id="info"></div>
</div></div>
<div class="card"><div class="logbar"><div id="loghead">未选择文件<span id="rate"></span></div><button id="sortBtn" class="ghost sm" title="切换排序">⇅ 最新在前</button><button id="wrapBtn" class="ghost sm" title="切换自动换行">↵ 换行：关</button></div><div id="distbar" class="distbar" hidden><span class="e"></span><span class="w"></span><span class="n"></span></div><div id="logs"></div>
  <div id="pager"><button id="prev" class="ghost">← 上一页</button>
    <span id="pageinfo"></span><button id="next" class="ghost">下一页 →</button></div>
  <div class="hint kbd-hint">快捷键：<kbd>/</kbd> 搜索 <kbd>t</kbd> 实时 <kbd>←</kbd><kbd>→</kbd> 翻页 <kbd>Ctrl+K</kbd> 命令</div>
</div>
<div id="cmdMask" class="cmd-mask" hidden><div class="cmd-box"><input id="cmdInput" placeholder="输入命令或文件名…" autocomplete="off" /><div id="cmdList"></div></div></div>
<script src="app.js"></script>
</body>
</html>
