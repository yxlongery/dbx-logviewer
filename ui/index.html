<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日志查看器</title>
<style>
  body { margin: 0; padding: 16px; font-family: var(--font-sans, Inter, system-ui, sans-serif);
    background: var(--color-background, #f4f4fb); color: var(--color-foreground, #18181b); }
  .card { background: var(--color-card, #fff); border: 1px solid var(--color-border, #e5e5ef);
    border-radius: var(--radius-lg, 16px); padding: 16px 20px; margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(80,70,180,.08); }
  h2 { margin: 0 0 12px; font-size: 17px; }
  #files { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .file { border: 1px solid var(--color-border, #e5e5ef); border-radius: 12px; padding: 12px 14px;
    cursor: pointer; background: var(--color-background, #fafaff); position: relative; }
  .file b { display: block; font-size: 14px; word-break: break-all; }
  .file span { font-size: 12px; opacity: .65; }
  .file.active { outline: 2px solid var(--color-primary, #6d5dfc); background: #efedff; }
  .grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
  label { font-size: 13px; font-weight: 600; display: block; margin: 8px 0 4px; }
  input, select { width: 100%; padding: 9px 12px; font: inherit; font-size: 14px;
    border: 1px solid var(--color-border, #e0e0ea); border-radius: 10px;
    background: var(--color-background, #fff); color: inherit; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  button { border: 0; border-radius: 12px; padding: 10px 20px; font: inherit; font-weight: 650;
    cursor: pointer; color: #fff; background: var(--color-primary, #6d5dfc); }
  button.green { background: #22a06b; }
  button.orange { background: #e8822a; }
  button.ghost { background: var(--color-muted, #eceaf6); color: inherit; }
  button.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
  #quickrow { margin-top: 10px; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { font-size: 13px; }
  #status .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #e03434; margin-right: 6px; }
  #status.live .dot { background: #22a06b; }
  #loghead { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  #logs { height: 420px; overflow-y: auto; background: #14131a; color: #d7d7e3; border-radius: 10px;
    padding: 12px 14px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 12.5px; line-height: 1.7; }
  #logs .ln { color: #7c7c9c; margin-right: 10px; user-select: none; }
  #logs mark { background: #ffe14d; color: #111; border-radius: 3px; padding: 0 2px; }
  #logs .err { color: #ff8f8f; } #logs .warn { color: #ffd479; }
  #pager { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; }
  .hint { font-size: 12.5px; opacity: .7; margin-top: 8px; }
  /* ===== 美化：顶栏 / 卡片 / 徽章 / 空状态（纯 CSS，不改 JS 逻辑） ===== */
  .hero { display: flex; align-items: center; gap: 14px; color: #fff;
    background: linear-gradient(135deg, var(--hero-from, rgba(109,93,252,.78)) 0%, var(--hero-mid, rgba(79,142,247,.68)) 55%, var(--hero-to, rgba(44,201,167,.72)) 100%);
    backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.25); border-bottom: 2px solid rgba(255,255,255,.35);
    border-radius: var(--radius-lg, 16px); padding: 18px 22px; margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(80,70,180,.25); position: relative; z-index: 2; }
  /* z-index 高于 .card(1)：主题面板展开时压住下方卡片，不被盖住 */
  /* 旧 WebView 不支持毛玻璃时回退实色渐变 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .hero { background: linear-gradient(135deg, #6d5dfc 0%, #4f8ef7 55%, #2cc9a7 100%); }
  }
  .hero-icon { font-size: 30px; line-height: 1; background: rgba(255,255,255,.18);
    border-radius: 12px; padding: 8px 10px; }
  .hero-text { flex: 1; min-width: 0; }
  .hero-text h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
  .hero-text p { margin: 4px 0 0; font-size: 12.5px; opacity: .85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-status { font-size: 13px; background: rgba(0,0,0,.25); border-radius: 999px;
    padding: 6px 14px; white-space: nowrap; }
  button { transition: filter .15s, transform .15s; box-shadow: 0 2px 8px rgba(80,70,180,.25); }
  button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  #quickrow button { border-radius: 999px; }
  .file { transition: transform .15s, box-shadow .15s; }
  .file:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(80,70,180,.18); }
  .file.active { outline: none; border: 1px solid #6d5dfc;
    background: linear-gradient(180deg, #efedff, #e3e0ff);
    box-shadow: 0 0 0 2px rgba(109,93,252,.35), 0 6px 18px rgba(80,70,180,.2); }
  #logs { border: 1px solid var(--color-border, #2a2a3a);
    box-shadow: inset 0 2px 12px rgba(0,0,0,.5); }
  #logs .err, #logs .warn { border-left: 3px solid transparent;
    padding-left: 8px; margin-left: -11px; border-radius: 0 6px 6px 0; }
  #logs .err { border-left-color: #ff6b6b; background: rgba(255,80,80,.08); }
  #logs .warn { border-left-color: #ffd479; background: rgba(255,212,121,.06); }
  #logs .err::before { content: "ERROR"; font-size: 10px; font-weight: 700; color: #fff;
    background: #e03434; border-radius: 4px; padding: 1px 6px; margin-right: 8px; }
  #logs .warn::before { content: "WARN"; font-size: 10px; font-weight: 700; color: #111;
    background: #ffd479; border-radius: 4px; padding: 1px 6px; margin-right: 8px; }
  .empty { text-align: center; padding: 28px 12px; opacity: .75; }
  .empty .big { font-size: 32px; display: block; margin-bottom: 8px; }
  /* ===== B轮：玻璃光斑 / Bento / 三档主题（纯 CSS 变量覆盖） ===== */
  :root { --glow-opacity: .35; }
  body::before, body::after { content: ""; position: fixed; width: 480px; height: 480px;
    border-radius: 50%; filter: blur(120px); opacity: var(--glow-opacity);
    pointer-events: none; z-index: 0; }
  body::before { top: -160px; left: -120px;
    background: radial-gradient(circle, var(--glow-a, #6d5dfc), transparent 70%); }
  body::after { bottom: -180px; right: -120px;
    background: radial-gradient(circle, var(--glow-b, #2cc9a7), transparent 70%); }
  .card { position: relative; z-index: 1; }
  /* 浅色档：强制浅色变量（覆盖宿主深色） */
  body[data-theme="light"] { --color-background: #f4f4fb; --color-card: #fff;
    --color-border: #e5e5ef; --color-foreground: #18181b; --color-muted: #eceaf6;
    --color-primary: #6d5dfc; --glow-opacity: .22; }
  /* 深色档：Linear 风深底 + 细边框 */
  body[data-theme="dark"] { --color-background: #13131a; --color-card: #1c1c26;
    --color-border: #2e2e42; --color-foreground: #e8e8f0; --color-muted: #2a2a3a;
    --color-primary: #8b7ffc; --glow-opacity: .5; }
  body[data-theme="dark"] .file.active {
    background: linear-gradient(180deg, #2b2650, #232038); border-color: #8b7ffc; }
  /* Bento：按体积三档跨度，大文件卡片更显眼 */
  #files { grid-template-columns: repeat(6, 1fr); }
  .file.bento-lg { grid-column: span 3; }
  .file.bento-md, .file.bento-sm { grid-column: span 2; }
  .file.bento-lg b { font-size: 15px; }
  @media (max-width: 900px) {
    .file.bento-lg, .file.bento-md { grid-column: span 6; }
    .file.bento-sm { grid-column: span 3; }
  }
  @media (max-width: 600px) {
    #files { grid-template-columns: 1fr 1fr; }
    #files .file { grid-column: span 2; }
  }
  /* 顶栏主题按钮：透明底白字 */
  .theme-btn { background: rgba(255,255,255,.18); box-shadow: none;
    padding: 6px 12px; font-size: 15px; border-radius: 999px; }
  /* ===== 多主题：墨绿 / 深海 / 黄昏 / 薄荷（变量覆盖，日志区保持深色） ===== */
  body[data-theme="forest"] { --color-background: #0d1512; --color-card: #142019;
    --color-border: #23402f; --color-foreground: #dff0e6; --color-muted: #1a2b22;
    --color-primary: #2cc9a7; --glow-opacity: .45;
    --glow-a: #1f7a5c; --glow-b: #2cc9a7;
    --hero-from: rgba(20,60,45,.82); --hero-mid: rgba(30,120,85,.72); --hero-to: rgba(44,201,167,.78); }
  body[data-theme="forest"] .file.active {
    background: linear-gradient(180deg, #143326, #10241b); border-color: #2cc9a7; }
  body[data-theme="ocean"] { --color-background: #0f1a2e; --color-card: #16233c;
    --color-border: #28405f; --color-foreground: #dfe9f7; --color-muted: #1c2c47;
    --color-primary: #4f8ef7; --glow-opacity: .45;
    --glow-a: #2456a8; --glow-b: #4f8ef7;
    --hero-from: rgba(25,55,110,.82); --hero-mid: rgba(50,110,200,.72); --hero-to: rgba(79,142,247,.78); }
  body[data-theme="ocean"] .file.active {
    background: linear-gradient(180deg, #1a2c4e, #142238); border-color: #4f8ef7; }
  body[data-theme="sunset"] { --color-background: #1c1410; --color-card: #262019;
    --color-border: #4a3826; --color-foreground: #f5e8d8; --color-muted: #2e2620;
    --color-primary: #e8822a; --glow-opacity: .45;
    --glow-a: #8a4a1a; --glow-b: #e8822a;
    --hero-from: rgba(150,60,20,.82); --hero-mid: rgba(200,110,35,.72); --hero-to: rgba(232,150,60,.78); }
  body[data-theme="sunset"] .file.active {
    background: linear-gradient(180deg, #3a2a1a, #2a1f14); border-color: #e8822a; }
  body[data-theme="mint"] { --color-background: #eef7f3; --color-card: #fff;
    --color-border: #d4e8df; --color-foreground: #16352a; --color-muted: #ddeee6;
    --color-primary: #22a06b; --glow-opacity: .2;
    --glow-a: #22a06b; --glow-b: #7fd6b2;
    --hero-from: rgba(20,90,65,.82); --hero-mid: rgba(34,160,107,.72); --hero-to: rgba(60,190,140,.78); }
  body[data-theme="mint"] .file.active {
    background: linear-gradient(180deg, #e2f3ea, #d2ecdf); border-color: #22a06b; }
  /* ===== DBX 原生：对齐宿主 daisyUI token；浅/深双档跟随系统色彩方案 ===== */
  /* 取值来源：调试外壳页 light/dark 两套 --color-base-*/--color-primary（oklch 转 hex 近似） */
  body[data-theme="dbx"] { color-scheme: light dark;
    --color-background: light-dark(#fafafa, #191e24);
    --color-card: light-dark(#ffffff, #1d232a);
    --color-border: light-dark(#f1f1f1, #15191e);
    --color-foreground: light-dark(#28282e, #f4f6fb);
    --color-muted: light-dark(#f1f1f1, #15191e);
    --color-primary: light-dark(#5f3dc4, #7c5cf0);
    --radius-lg: 8px; --glow-opacity: 0; }
  /* 原生平面：顶栏去渐变去玻璃，卡片/按钮去阴影，圆角向 daisyUI 看齐（field 4px/box 8px） */
  body[data-theme="dbx"] .hero { background: var(--color-card); color: var(--color-foreground);
    border: 1px solid var(--color-border); box-shadow: none;
    backdrop-filter: none; -webkit-backdrop-filter: none; }
  body[data-theme="dbx"] .hero-icon, body[data-theme="dbx"] .hero-status { background: var(--color-muted); }
  body[data-theme="dbx"] .card { box-shadow: none; }
  body[data-theme="dbx"] button { border-radius: 4px; box-shadow: none; }
  body[data-theme="dbx"] button:hover:not(:disabled) { transform: none; }
  body[data-theme="dbx"] #quickrow button { border-radius: 4px; }
  body[data-theme="dbx"] input, body[data-theme="dbx"] select { border-radius: 4px; }
  body[data-theme="dbx"] .file { border-radius: 8px; }
  body[data-theme="dbx"] .file:hover { transform: none; box-shadow: none; border-color: var(--color-primary); }
  body[data-theme="dbx"] .file.active { background: var(--color-card);
    border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  body[data-theme="dbx"] #logs { border-radius: 8px; }
  body[data-theme="dbx"] #dirs .dir { border-radius: 4px; }
  /* 主题面板：顶栏右下浮层，色卡圆点 + 名称 */
  .theme-panel { position: absolute; top: calc(100% + 8px); right: 16px; z-index: 10;
    background: var(--color-card, #fff); color: var(--color-foreground, #18181b);
    border: 1px solid var(--color-border, #e5e5ef); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.25); padding: 6px; min-width: 150px; }
  .theme-opt { display: flex; align-items: center; gap: 8px; font-size: 13px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .theme-opt:hover { background: var(--color-muted, #eceaf6); }
  .theme-opt.sel { font-weight: 700; }
  .theme-opt .dot { width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid var(--color-border, #ccc); flex: none; }
  /* ===== 高端：流光 / 骨架 / 排印 / 分布条 / 命令面板 / 外观开关 ===== */
  /* 实时流光：LIVE 呼吸灯 + 新行滑入（body[data-fx-flow="off"] 一键全关） */
  #status.live .dot { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,160,107,.55); }
    50% { box-shadow: 0 0 0 7px rgba(34,160,107,0); } }
  #logs .fresh { animation: slidein .25s ease-out; }
  @keyframes slidein { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  body[data-fx-flow="off"] #logs .fresh { animation: none; }
  body[data-fx-flow="off"] #status.live .dot { animation: none; }
  body[data-fx-flow="off"] #rate { display: none; }
  #rate { float: right; font-weight: 400; font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
  /* 骨架屏：搜索等待占位 */
  #logs .skel { height: 14px; margin: 7px 0; border-radius: 4px;
    background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.13), rgba(255,255,255,.05));
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  /* 排印：行号 gutter 对齐 + hover 高亮 + 数字等宽 */
  #logs .ln { min-width: 46px; display: inline-block; text-align: right; font-variant-numeric: tabular-nums; }
  #logs > div:hover { filter: brightness(1.35); }
  /* 上下文行淡显 + 左虚线；结构化 token 着色（tk-t 时间戳/tk-b 方括号/tk-l* 级别） */
  #logs .ctx { opacity: .55; border-left: 2px dashed #55556e; padding-left: 8px; margin-left: -10px; }
  #logs .tk-t { color: #8fd6c2; }
  #logs .tk-b { color: #9a9ab5; }
  #logs .tk-le { color: #ff8f8f; font-weight: 700; }
  #logs .tk-lw { color: #ffd479; font-weight: 700; }
  #logs .tk-li { color: #7fb8ff; font-weight: 700; }
  #logs .tk-lo { color: #b9b9d0; font-weight: 700; }
  .file span, #pageinfo { font-variant-numeric: tabular-nums; }
  /* 级别分布条：红/黄/蓝 stacked bar（body[data-fx-dist="off"] 隐藏） */
  .distbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden;
    margin-bottom: 8px; background: rgba(255,255,255,.07); }
  .distbar .e { background: #e03434; } .distbar .w { background: #e8b53a; } .distbar .n { background: #3a7bd5; }
  body[data-fx-dist="off"] #distbar { display: none; }
  /* 命令面板：全屏遮罩 + 居中浮框 */
  .cmd-mask { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45);
    backdrop-filter: blur(4px); display: flex; justify-content: center; padding-top: 12vh; }
  .cmd-mask[hidden] { display: none; }
  .cmd-box { width: min(560px, 90vw); height: fit-content; max-height: 60vh; overflow: hidden;
    background: var(--color-card, #fff); color: var(--color-foreground, #18181b);
    border: 1px solid var(--color-border, #e5e5ef); border-radius: 14px;
    box-shadow: 0 24px 64px rgba(0,0,0,.4); }
  .cmd-box input { border: 0; border-bottom: 1px solid var(--color-border, #e5e5ef);
    border-radius: 14px 14px 0 0; }
  .cmd-box input:focus { outline: none; }
  #cmdList { max-height: 46vh; overflow-y: auto; padding: 6px; }
  .cmd-item { display: flex; gap: 8px; align-items: center; font-size: 13.5px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer; }
  .cmd-item .sub { margin-left: auto; font-size: 12px; opacity: .55; }
  .cmd-item.sel { background: var(--color-muted, #eceaf6); font-weight: 650; }
  /* 外观面板：主题区与特效区分隔 */
  .theme-sep { border-top: 1px solid var(--color-border, #e5e5ef); margin: 6px 4px; }
  .theme-sec { font-size: 11px; opacity: .6; padding: 4px 10px; }
  .fx-opt .check { width: 14px; color: var(--color-primary, #6d5dfc); flex: none; }
  .fx-opt.off .check { visibility: hidden; }
  .fx-opt.off { opacity: .55; }
  /* 快捷键提示（body[data-fx-keys="off"] 隐藏） */
  .kbd-hint kbd { background: var(--color-muted, #eceaf6); border-radius: 4px;
    padding: 0 6px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; }
  body[data-fx-keys="off"] .kbd-hint { display: none; }
  /* 目录浏览与隐藏：复用现有圆角/字号，不引入新组件 */
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 160px; }
  .toolbar select { flex: 0 1 160px; }
  .toolbar button { padding: 9px 14px; }
  #crumb { font-size: 13px; margin-bottom: 8px; }
  #crumb .crumb { cursor: pointer; font-weight: 650; }
  #crumb .crumb:hover { text-decoration: underline; }
  #dirs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  #dirs .dir { cursor: pointer; font-size: 13px; border: 1px solid var(--color-border, #e5e5ef);
    border-radius: 10px; padding: 6px 12px; background: var(--color-background, #fafaff); }
  #dirs .dir:hover { outline: 2px solid var(--color-primary, #6d5dfc); }
  .file .hide { position: absolute; top: 6px; right: 10px; cursor: pointer;
    font-size: 12px; opacity: .45; padding: 2px 6px; }
  .file .hide:hover { opacity: 1; color: #e03434; }
  .file .tgt { display: block; font-size: 11px; opacity: .55; word-break: break-all; }
  #hiddenbar { font-size: 12.5px; opacity: .8; margin-top: 8px; display: flex; gap: 10px; align-items: center; }
  #hiddenbar button { padding: 4px 12px; font-size: 12.5px; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-icon">📋</div>
  <div class="hero-text"><h1>日志查看器</h1><p id="heroSub">选择左侧文件开始查看</p></div>
  <div class="hero-status" id="status"><span class="dot"></span><span id="statusText">实时通道未连接</span></div>
  <button id="themeBtn" class="theme-btn" title="选择主题">🎨</button>
  <button id="cmdBtn" class="theme-btn" title="命令面板 (Ctrl+K)">⌘</button>
  <div id="themePanel" class="theme-panel" hidden>
    <div class="theme-opt" data-t="dbx"><span class="dot" style="background:#fafafa"></span>🖥️ DBX 原生</div>
    <div class="theme-opt" data-t="auto"><span class="dot" style="background:linear-gradient(135deg,#6d5dfc,#2cc9a7)"></span>🔄 跟随</div>
    <div class="theme-opt" data-t="light"><span class="dot" style="background:#f4f4fb"></span>☀️ 纸白</div>
    <div class="theme-opt" data-t="dark"><span class="dot" style="background:#13131a"></span>🌙 午夜</div>
    <div class="theme-opt" data-t="forest"><span class="dot" style="background:#0d1512"></span>🌲 墨绿</div>
    <div class="theme-opt" data-t="ocean"><span class="dot" style="background:#0f1a2e"></span>🌊 深海</div>
    <div class="theme-opt" data-t="sunset"><span class="dot" style="background:#1c1410"></span>🌇 黄昏</div>
    <div class="theme-opt" data-t="mint"><span class="dot" style="background:#eef7f3"></span>🌿 薄荷</div>
    <div class="theme-sep"></div>
    <div class="theme-sec">特效</div>
    <div class="theme-opt fx-opt" data-fx="flow"><span class="check">✓</span>✨ 实时流光</div>

<script>
const $ = id => document.querySelector("#" + id);
const state = { dirs: [], files: [], dir: "", file: null, page: 1, total: 0, streamId: null, tailing: false, connId: null, hidden: [], fileFilter: "", fileSort: "time" };
// HTML 转义：日志原文直接插 innerHTML 会执行标签，先转义再高亮
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtSize = n => n > 1048576 ? (n/1048576).toFixed(2)+" MB" : n > 1024 ? (n/1024).toFixed(2)+" KB" : n+" B";
const fmtTime = t => t ? new Date(t*1000).toLocaleString("zh-CN",{hour12:false}) : "-";
// datetime-local(2026-08-30T11:04)→后端宽松解析(2026-08-30 11:04:20)：补秒+空格
const normTime = v => v ? v.replace("T"," ").slice(0,16)+":00" : "";

async function invoke(method, params, options={timeoutMs:60000}) {
  return window.dbxPlugin.invoke(method, { connectionId: state.connId, ...params }, options);
}
function lineHtml(no, text, fresh, isCtx) {
  let h = esc(text);
  // 结构化着色先行：命中片段进占位 stash，关键字高亮切不到 NUL 占位符，最后换回
  const stash = [];
  if (fx.struct) h = structHtml(h, stash);
  const kw = $("keyword").value.trim();
  // 正则模式下 kw 是表达式，字面 split 无意义则跳过高亮（后端已按正则过滤）
  if (kw && !$("regexCk").checked) h = h.split(esc(kw)).join("<mark>"+esc(kw)+"</mark>");
  if (fx.struct) h = h.replace(/\x00(\d+)\x00/g, (_, i) => stash[+i]);
  const cls = /ERROR|FATAL/i.test(text) ? "err" : /WARN/i.test(text) ? "warn" : "";
  // fresh 实时行滑入动画由 CSS .fresh 承载；ctx 上下文行淡显
  return `<div class="${cls}${fresh ? " fresh" : ""}${isCtx ? " ctx" : ""}"><span class="ln">${no}</span>${h}</div>`;
}
// 结构化着色（输入已转义）：行首时间戳 + [LEVEL] token + 其他方括号段；命中片段压 stash 返回占位
function structHtml(h, stash) {
  const tok = (cls, m) => { stash.push(`<span class="${cls}">${m}</span>`); return "\x00" + (stash.length - 1) + "\x00"; };
  h = h.replace(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}[T ]\d{2}:\d{2}:\d{2}(?:\.\d+)?(?:Z|[+-]\d{2}:?\d{2})?/,
    m => tok("tk-t", m));
  h = h.replace(/\[(INF|DBG|WRN|ERR|TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\]/gi, m => {
    const c = /ERR|FATAL/i.test(m) ? "tk-le" : /WARN/i.test(m) ? "tk-lw" : /INFO|INF/i.test(m) ? "tk-li" : "tk-lo";
    return tok(c, m);
  });
  h = h.replace(/\[[^\][<>]{1,40}\]/g, m => tok("tk-b", m)); // 线程/类名等方括号段淡色
  return h;
}
function render(lines) {
  $("logs").innerHTML = lines.map(l => lineHtml(l.no, l.text, false, l.match === false)).join("") || '<div class="empty"><span class="big">🔎</span>无匹配日志，换个关键字试试</div>';
  if ($("autoscroll").checked) $("logs").scrollTop = $("logs").scrollHeight;
  const pages = Math.max(1, Math.ceil(state.total / +$("pageSize").value));
  $("pageinfo").textContent = `第 ${state.page} / ${pages} 页，共 ${state.total} 行`;
  renderDistbar(lines); // 当前页级别占比（近似分布，不含实时追加行）
}
// 级别分布条：按当前页统计 err/warn/其余占比；空结果则隐藏
function renderDistbar(lines) {
  const bar = $("distbar");
  if (!bar || !fx.dist || !lines.length) { if (bar) bar.hidden = true; return; }
  let e = 0, w = 0;
  for (const l of lines) {
    if (/ERROR|FATAL/i.test(l.text)) e++;
    else if (/WARN/i.test(l.text)) w++;
  }
  const n = lines.length, pct = v => (v / n * 100).toFixed(1) + "%";
  const segs = bar.children;
  segs[0].style.width = pct(e); segs[1].style.width = pct(w); segs[2].style.width = pct(n - e - w);
  bar.hidden = false;
  bar.title = `ERROR ${e} / WARN ${w} / 其他 ${n - e - w}（当前页）`;
}
async function loadBrowse(dir) {
  if (dir !== undefined) state.dir = dir;
  const r = await invoke("logs/browse", { dir: state.dir });
  state.dirs = r.dirs; state.files = r.entries;
  renderCrumb(); renderDirs(); renderFiles();
}
// 面包屑：根 + 各级，可点回退；换目录时清空选中
function renderCrumb() {
  const parts = state.dir ? state.dir.split("/") : [];
  let h = `<span class="crumb" data-d="">根</span>`;
  let acc = "";
  parts.forEach(p => { acc = acc ? acc + "/" + p : p; h += ` / <span class="crumb" data-d="${esc(acc)}">${esc(p)}</span>`; });
  $("crumb").innerHTML = h;
  document.querySelectorAll(".crumb").forEach(el => el.onclick = () => {
    state.file = null; loadBrowse(el.dataset.d).catch(e => $("info").textContent = "浏览失败：" + e.message);
  });
}
// 子目录：点进入
function renderDirs() {
  $("dirs").innerHTML = state.dirs.map(d =>
    `<span class="dir" data-d="${esc(state.dir ? state.dir + "/" + d.name : d.name)}">📁 ${esc(d.name)}</span>`).join("");
  document.querySelectorAll(".dir").forEach(el => el.onclick = () => {
    state.file = null; loadBrowse(el.dataset.d).catch(e => $("info").textContent = "浏览失败：" + e.message);
  });
}
// 文件卡片：隐藏名单过滤 + 文件名过滤 + 排序；选中态在刷新后保留
function visibleFiles() {
  const kw = state.fileFilter.trim();
  const list = state.files.filter(f => !state.hidden.includes(f.name) && (!kw || f.name.includes(kw)));
  if (state.fileSort === "name") list.sort((a, b) => a.name < b.name ? -1 : 1);
  else if (state.fileSort === "size") list.sort((a, b) => b.size - a.size);
  else list.sort((a, b) => b.modified_at - a.modified_at);
  return list;
}
// 短名：相对路径只取末段展示，全路径放 title 与 tgt 行
const shortName = rel => rel.split("/").pop();
// Bento 分档：>10MB 大卡跨3列，>1MB 中卡，其余小卡（只定跨度，不改过滤排序）
const bento = f => f.size > 10485760 ? " bento-lg" : f.size > 1048576 ? " bento-md" : " bento-sm";
function renderFiles() {
  const list = visibleFiles();
  $("files").innerHTML = list.map(f =>
    `<div class="file${state.file === f.name ? " active" : ""}${bento(f)}" data-n="${esc(f.name)}"><span class="hide" data-n="${esc(f.name)}" title="仅在界面隐藏，文件保留">隐藏</span><b>${esc(shortName(f.name))}</b><span>${fmtSize(f.size)}　${fmtTime(f.modified_at)}</span><span class="tgt" title="${esc(f.name)}">${esc(f.name)}</span></div>`).join("")
    || '<div class="empty"><span class="big">📂</span>本目录下没有匹配的 .log / .out 文件</div>';
  document.querySelectorAll(".file").forEach(el => el.onclick = () => {
    document.querySelectorAll(".file").forEach(x => x.classList.remove("active"));
    el.classList.add("active"); state.file = el.dataset.n; state.page = 1; doSearch();
  });
  document.querySelectorAll(".file .hide").forEach(el => el.onclick = e => {
    e.stopPropagation(); doHide(el.dataset.n);
  });
  renderHiddenBar();
}
// 隐藏只藏界面、文件保留：名单按连接存 storage，可恢复
async function doHide(name) {
  if (!confirm(`仅在界面隐藏（文件保留，可恢复），确认隐藏 ${name}？`)) return;
  if (state.tailing && state.file === name) await toggleTail().catch(()=>{});
  state.hidden.push(name);
  if (state.file === name) { state.file = null; $("logs").innerHTML = ""; $("loghead").innerHTML = '未选择文件<span id="rate"></span>'; $("heroSub").textContent = "选择左侧文件开始查看"; }
  await saveHidden(); renderFiles();
  $("info").textContent = "已隐藏（文件保留）";
}
function renderHiddenBar() {
  $("hiddenbar").innerHTML = state.hidden.length
    ? `<span>已隐藏 ${state.hidden.length} 个（文件均保留）</span><button id="unhide" class="ghost">恢复全部</button>`
    : "";
  const b = $("unhide");
  if (b) b.onclick = async () => { state.hidden = []; await saveHidden(); renderFiles(); };
}
async function loadHidden() {
  try { if (window.dbxPlugin.capabilities.storage && state.connId) {
    const h = await window.dbxPlugin.storage.get("hidden:" + state.connId);
    if (Array.isArray(h)) state.hidden = h;
  } } catch {} // 存储失败不阻塞主流程
}
async function saveHidden() {
  try { if (window.dbxPlugin.capabilities.storage && state.connId)
    await window.dbxPlugin.storage.set("hidden:" + state.connId, state.hidden);
  } catch {} // 存储失败不阻塞主流程
}
// 快捷时间：填 start 为 now-分钟、end 留空（=至今），直接搜；手动改框不互斥
const pad2 = n => String(n).padStart(2, "0");
const toLocalInput = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function setQuick(min) {
  $("start").value = toLocalInput(new Date(Date.now() - min*60000));
  $("end").value = "";
  state.page = 1; doSearch().catch(e => $("info").textContent = "搜索失败：" + e.message);
}
async function doSearch() {
  if (!state.file) { $("info").textContent = "请先选择日志文件"; return; }
  // 骨架屏：等待期间占位（关特效则直接空白等待）
  if (fx.skel) $("logs").innerHTML = '<div class="skel"></div>'.repeat(8);
  try {
    const r = await invoke("logs/search", { file: state.file, keyword: $("keyword").value,
      regex: $("regexCk").checked, context: +$("context").value,
      level: $("level").value, startTime: normTime($("start").value), endTime: normTime($("end").value),
      page: state.page, pageSize: +$("pageSize").value, sort: $("sort").value });
    state.total = r.total; render(r.lines);
    $("loghead").innerHTML = `${esc(state.file)}（共 ${r.total} 行${r.truncated ? "，已截断" : ""}）<span id="rate"></span>`;
    $("heroSub").textContent = `${state.file} · 共 ${r.total} 行`;
    $("info").textContent = "";
    pushHistKw($("keyword").value); // 成功搜索的关键字记入命令面板历史
    saveCond(); // 搜成功才记条件，避免脏条件污染
  } catch (e) { $("logs").innerHTML = ""; $("info").textContent = "搜索失败：" + e.message; }
}
// 多主题：id 存 storage 持久化；auto 跟随宿主，其余走 data-theme 变量覆盖
const THEMES = [
  { id: "dbx", name: "DBX 原生", icon: "🖥️", dot: "#fafafa" },
  { id: "auto", name: "跟随", icon: "🔄", dot: "linear-gradient(135deg,#6d5dfc,#2cc9a7)" },
  { id: "light", name: "纸白", icon: "☀️", dot: "#f4f4fb" },
  { id: "dark", name: "午夜", icon: "🌙", dot: "#13131a" },
  { id: "forest", name: "墨绿", icon: "🌲", dot: "#0d1512" },
  { id: "ocean", name: "深海", icon: "🌊", dot: "#0f1a2e" },
  { id: "sunset", name: "黄昏", icon: "🌇", dot: "#1c1410" },
  { id: "mint", name: "薄荷", icon: "🌿", dot: "#eef7f3" },
];
let theme = "dbx";
const themeById = id => THEMES.find(t => t.id === id);
function applyTheme(t) {
  if (!themeById(t)) t = "dbx";
  theme = t;
  if (t === "auto") document.body.removeAttribute("data-theme");
  else document.body.setAttribute("data-theme", t);
  const b = $("themeBtn"), m = themeById(t);
  if (b) { b.textContent = "🎨"; b.title = "选择主题：当前" + m.name; }
  renderThemePanel();
}
// 面板选项：色卡圆点 + 图标 + 名称，当前项加粗
// 面板选中态：静态选项只更新 .sel，不重渲染内容（渲染失败即空白，故静态化）
function renderThemePanel() {
  document.querySelectorAll("#themePanel .theme-opt").forEach(o =>
    o.classList.toggle("sel", o.dataset.t === theme));
}
function toggleThemePanel(show) {
  const p = $("themePanel");
  if (!p) return;
  const open = show !== undefined ? show : p.hidden;
  if (open) renderThemePanel();
  p.hidden = !open;
}
async function saveTheme() {
  try { if (window.dbxPlugin.capabilities.storage) await window.dbxPlugin.storage.set("theme", theme); } catch {}
}
async function loadTheme() {
  try { if (window.dbxPlugin.capabilities.storage) {
    const t = await window.dbxPlugin.storage.get("theme");
    if (themeById(t)) { applyTheme(t); return; }
  } } catch {} // 存储失败不阻塞主流程
  applyTheme("dbx"); // 默认 DBX 原生；老存量 auto/light/dark 照常兼容
}
// 特效开关：flow 流光 / dist 分布条 / skel 骨架屏 / keys 快捷键提示；存 storage 持久化
const FX_KEYS = ["flow", "dist", "skel", "keys", "struct"];
let fx = { flow: true, dist: true, skel: true, keys: true, struct: true };
function applyFx() {
  for (const k of FX_KEYS) {
    if (fx[k]) document.body.removeAttribute("data-fx-" + k);
    else document.body.setAttribute("data-fx-" + k, "off");
  }
  document.querySelectorAll("#themePanel .fx-opt").forEach(o =>
    o.classList.toggle("off", !fx[o.dataset.fx]));
}
async function saveFx() {
  try { if (window.dbxPlugin.capabilities.storage) await window.dbxPlugin.storage.set("fx", fx); } catch {}
}
async function loadFx() {
  try { if (window.dbxPlugin.capabilities.storage) {
    const s = await window.dbxPlugin.storage.get("fx");
    if (s) for (const k of FX_KEYS) if (typeof s[k] === "boolean") fx[k] = s[k];
  } } catch {} // 存储失败不阻塞主流程
  applyFx();
}
// 命令面板历史关键字（内存，最多 5 个，供面板快捷搜索）
const histKw = [];
function pushHistKw(kw) {
  kw = (kw || "").trim();
  if (!kw) return;
  const i = histKw.indexOf(kw);
  if (i >= 0) histKw.splice(i, 1);
  histKw.unshift(kw);
  if (histKw.length > 5) histKw.length = 5;
}
// 子序列模糊匹配：命中返回分数（连续命中加权），未命中返回 -1
function fuzzy(q, s) {
  q = (q || "").toLowerCase(); s = (s || "").toLowerCase();
  if (!q) return 0;
  let qi = 0, score = 0, last = -2;
  for (let i = 0; i < s.length && qi < q.length; i++) {
    if (s[i] === q[qi]) { score += (last === i - 1) ? 2 : 1; last = i; qi++; }
  }
  return qi === q.length ? score : -1;
}
let cmdItems = [], cmdSel = 0;
// 命令候选：快捷操作 + 历史关键字 + 可见文件；fuzzy 过滤取前 12
function renderCmd() {
  const q = $("cmdInput").value.trim(), pool = [];
  const ops = [
    { label: "🔍 搜 ERROR", sub: "操作", run: () => { $("level").value = "ERROR"; state.page = 1; doSearch(); } },
    { label: "🔍 搜 WARN", sub: "操作", run: () => { $("level").value = "WARN"; state.page = 1; doSearch(); } },
    { label: "⏱ 实时监控 开/关", sub: "操作", run: () => $("tail").click() },
    { label: "⬇ 下载日志", sub: "操作", run: () => $("download").click() },
    { label: "清空时间条件", sub: "操作", run: () => { $("start").value = ""; $("end").value = ""; } },
  ];
  for (const o of ops) { const s = fuzzy(q, o.label); if (s >= 0) pool.push({ ...o, s: s + 100 }); }
  for (const k of histKw) { const s = fuzzy(q, k); if (s >= 0)
    pool.push({ label: "🔎 " + k, sub: "历史", s: s + 50, run: ((kk) => () => {
      $("keyword").value = kk; state.page = 1; doSearch(); })(k) }); }
  for (const f of visibleFiles()) { const s = fuzzy(q, shortName(f.name)); if (s >= 0)
    pool.push({ label: "📄 " + shortName(f.name), sub: fmtSize(f.size), s, run: ((ff) => () => {
      state.file = ff.name; state.page = 1; renderFiles(); doSearch(); })(f) }); }
  pool.sort((a, b) => b.s - a.s);
  cmdItems = pool.slice(0, 12); cmdSel = 0;
  $("cmdList").innerHTML = cmdItems.map((it, i) =>
    `<div class="cmd-item${i === cmdSel ? " sel" : ""}" data-i="${i}">${esc(it.label)}<span class="sub">${esc(it.sub)}</span></div>`).join("")
    || '<div class="hint" style="padding:12px">无匹配命令</div>';
}
function toggleCmd(show) {
  const m = $("cmdMask");
  if (!m) return;
  const open = show !== undefined ? show : m.hidden;
  m.hidden = !open;
  if (open) { $("cmdInput").value = ""; renderCmd(); setTimeout(() => $("cmdInput").focus(), 0); }
}
function cmdMove(d) {
  if (!cmdItems.length) return;
  cmdSel = (cmdSel + d + cmdItems.length) % cmdItems.length;
  document.querySelectorAll("#cmdList .cmd-item").forEach((el, i) =>
    el.classList.toggle("sel", i === cmdSel));
  const sel = document.querySelector("#cmdList .cmd-item.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}
// 实时吞吐：1 秒窗口计数，LIVE 时显示 x 行/秒
let rateN = 0, rateShown = false;
setInterval(() => {
  const el = document.querySelector("#rate");
  if (!el) return;
  if (state.tailing && rateShown) el.textContent = rateN + " 行/秒";
  else if (!state.tailing) el.textContent = "";
  rateN = 0;
}, 1000);
async function saveCond() {
  try { if (window.dbxPlugin.capabilities.storage)
    await window.dbxPlugin.storage.set("cond", { keyword: $("keyword").value, level: $("level").value,
      pageSize: $("pageSize").value, sort: $("sort").value, dir: state.dir, file: state.file,
      regex: $("regexCk").checked, context: $("context").value });
  } catch {} // 存储失败不阻塞主流程
}
async function loadCond() {
  try { if (window.dbxPlugin.capabilities.storage) {
    const c = await window.dbxPlugin.storage.get("cond");
    if (c) { $("keyword").value = c.keyword||""; $("level").value = c.level||"ALL";
      $("pageSize").value = c.pageSize||"100"; $("sort").value = c.sort||"desc";
      $("regexCk").checked = !!c.regex; $("context").value = c.context||"0";
      if (c.dir) state.dir = c.dir; state.resumeFile = c.file||null; }
  } } catch {}
}
async function toggleTail() {
  if (state.tailing) {
    await invoke("logs/stop", { streamId: state.streamId }).catch(()=>{});
    state.tailing = false; state.streamId = null;
    $("tail").textContent = "⏱ 实时监控";
    $("status").classList.remove("live"); $("statusText").textContent = "实时通道未连接";
    rateShown = false;
    return;
  }
  if (!state.file) { $("info").textContent = "请先选择日志文件"; return; }
  const r = await invoke("logs/tail", { file: state.file, keyword: $("keyword").value,
    regex: $("regexCk").checked,
    level: $("level").value, lastN: 200 }, { timeoutMs: 15000 });
  state.streamId = r.streamId; state.tailing = true;
  $("tail").textContent = "⏹ 停止监控";
  $("status").classList.add("live"); $("statusText").textContent = "实时监控中";
}
async function doDownload() {
  if (!state.file) { $("info").textContent = "请先选择日志文件"; return; }
  $("download").disabled = true;
  try {
    // 分块拉取后拼装：单块 JSON 不超限，大文件多轮拉
    const chunks = []; let offset = 0;
    for (let i = 0; i < 1000; i++) {
      const r = await invoke("logs/downloadChunk", { file: state.file, keyword: $("keyword").value,
        regex: $("regexCk").checked,
        level: $("level").value, offset, length: 2000 }, { timeoutMs: 60000 });
      chunks.push(r.lines.join("\n")); offset = r.nextOffset;
      $("info").textContent = `下载中…已拉取 ${offset} 行`;
      if (r.eof) break;
    }
    const text = chunks.join("\n"), ft = window.dbxPlugin.fileTransfer;
    if (ft) { // 桌面端：原生保存对话框 + 分块写入
      const t = await ft.beginSave({ name: state.file });
      if (!t) { $("info").textContent = "已取消保存"; return; }
      const data = new TextEncoder().encode(text);
      for (let o = 0; o < data.length; o += 256*1024)
        await ft.write(t.handleId, o, data.slice(o, o+256*1024));
      await ft.finish(t.handleId); $("info").textContent = `已保存 ${offset} 行`;
    } else { // Web 宿主：Blob 回退下载
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
      a.download = state.file; a.click(); URL.revokeObjectURL(a.href);
    }
  } catch (e) { $("info").textContent = "下载失败：" + e.message; }
  finally { $("download").disabled = false; }
}
function onBackendEvent(e) {
  // 兼容不同宿主版本的事件包形：{method,params} 或扁平体
  const m = e && (e.method || e.type || e.event);
  const p = (e && (e.params || e.data)) || e || {};
  if (m === "logs/append" && p.streamId === state.streamId && Array.isArray(p.lines)) {
    const atBottom = $("logs").scrollTop + $("logs").clientHeight >= $("logs").scrollHeight - 40;
    // fresh 标记滑入动画；rateN 供吞吐计数
    $("logs").insertAdjacentHTML("beforeend", p.lines.map(t => lineHtml("", t, true)).join(""));
    rateN += p.lines.length; rateShown = true;
    if ($("autoscroll").checked || atBottom) $("logs").scrollTop = $("logs").scrollHeight;
  }
}
window.addEventListener("DOMContentLoaded", async () => {
  $("search").onclick = () => { state.page = 1; doSearch().catch(e => $("info").textContent = "搜索失败：" + e.message); };
  $("refresh").onclick = () => loadBrowse().catch(e => $("info").textContent = "刷新失败：" + e.message);
  $("fileFilter").oninput = e => { state.fileFilter = e.target.value; renderFiles(); };
  $("fileSort").onchange = e => { state.fileSort = e.target.value; renderFiles(); };
  document.querySelectorAll("#quickrow [data-min]").forEach(b => b.onclick = () => setQuick(+b.dataset.min));
  $("clearTime").onclick = () => { $("start").value = ""; $("end").value = ""; };
  $("prev").onclick = () => { if (state.page > 1) { state.page--; doSearch().catch(e => $("info").textContent = e.message); } };
  $("next").onclick = () => { state.page++; doSearch().catch(e => { state.page--; $("info").textContent = e.message; }); };
  $("tail").onclick = () => toggleTail().catch(e => $("info").textContent = "实时监控失败：" + e.message);
  $("download").onclick = doDownload;
  $("themeBtn").onclick = e => { e.stopPropagation(); toggleThemePanel(); };
  $("themePanel").onclick = e => { const o = e.target.closest(".theme-opt");
    if (o) { applyTheme(o.dataset.t); saveTheme(); toggleThemePanel(false); } };
  // 点面板外关闭（按钮自身已 stopPropagation，不冲突）
  document.addEventListener("click", e => { const p = $("themePanel");
    if (p && !p.hidden && !e.target.closest("#themePanel,#themeBtn")) toggleThemePanel(false); });
  // 外观面板特效开关：切换 fx + 持久化，不关闭面板
  document.querySelectorAll("#themePanel .fx-opt").forEach(o => o.onclick = e => {
    e.stopPropagation(); fx[o.dataset.fx] = !fx[o.dataset.fx]; applyFx(); saveFx();
  });
  // 命令面板：按钮 + 输入过滤 + 上下回车 + 遮罩点击关闭
  $("cmdBtn").onclick = e => { e.stopPropagation(); toggleCmd(); };
  $("cmdInput").oninput = renderCmd;
  $("cmdInput").onkeydown = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); cmdMove(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cmdMove(-1); }
    else if (e.key === "Enter") { const it = cmdItems[cmdSel]; toggleCmd(false); if (it) it.run(); }
  };
  $("cmdList").onclick = e => { const o = e.target.closest(".cmd-item");
    if (o) { const it = cmdItems[+o.dataset.i]; toggleCmd(false); if (it) it.run(); } };
  $("cmdMask").onclick = e => { if (e.target === $("cmdMask")) toggleCmd(false); };
  // 全局快捷键：Ctrl+K 命令，Esc 关闭浮层；输入框内只响应 Esc
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); toggleCmd(); return; }
    if (e.key === "Escape") { toggleCmd(false); toggleThemePanel(false); return; }
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.key === "/") { e.preventDefault(); $("keyword").focus(); }
    else if (e.key === "t" && !e.ctrlKey && !e.metaKey) { $("tail").click(); }
    else if (e.key === "ArrowLeft") { $("prev").click(); }
    else if (e.key === "ArrowRight") { $("next").click(); }
  });
  if (!window.dbxPlugin) { $("info").textContent = "不在 DBX 宿主内：请经 DBX 工作台或 dbx-plugin dev 打开"; return; }
  await window.dbxPlugin.ready;
  state.connId = window.dbxPlugin.context && window.dbxPlugin.context.connectionId;
  if (!state.connId) { $("info").textContent = "无连接上下文：请从连接入口打开工作台"; return; }
  try { window.dbxPlugin.onEvent(onBackendEvent); } catch {} // 旧宿主无该 API 则实时推送不可用
  window.addEventListener("dbx-plugin-env", () => {}); // 主题经 CSS 变量自动跟随，无需手动刷新
  await loadCond();
  await loadTheme();
  await loadFx();
  await loadHidden();
  await loadBrowse().catch(e => $("info").textContent = "加载文件列表失败：" + e.message);
  // 上次选中的文件若仍在当前目录，自动恢复选中并搜索
  if (state.resumeFile && state.files.some(f => f.name === state.resumeFile) && !state.hidden.includes(state.resumeFile)) {
    state.file = state.resumeFile; state.page = 1;
    renderFiles();
    await doSearch().catch(e => $("info").textContent = "搜索失败：" + e.message);
  }
  state.resumeFile = null;
});
</script>
